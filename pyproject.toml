[project]
name = "llm-api-server"
version = "0.1.0"
description = "FastAPI server for MLX models"
authors = [
    { name = "Antigravity", email = "antigravity@example.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "mlx-lm>=0.12.0",
    "mlx>=0.10.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.1.0",
]
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
